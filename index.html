<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>AI french poem generator</title>
  </head>
  <body>
    <h1>Welcome to the french poem generator</h1>
    <main>
      <form>
        <input
          type="text"
          placeholder="Enter the topic of the French poem"
          autofocus
          required
          autocomplete="off"
          class="instructions"
        />
        <input type="submit" class="submit-button" />
      </form>
      <div>
        La tombe dit à la rose
        <br />
        Des pleurs dont l'aube t'arrose
      </div>
    </main>
    <footer>
      This AI project was coded by
      <a href="https://github.com/KatjaArndt" target="_blank">Katja Arndt</a>
      and is
      <a
        href="https://github.com/KatjaArndt/french-poem-generator"
        target="_blank"
      >
        open-sourced on GitHub</a
      >
      and is
      <a
        href="https://french-poem-generator-by-katja-arndt.netlify.app/"
        target="_blank"
        >hosted on Netlify</a
      >.
    </footer>
    <script src="src/index.js"></script>
  </body>
</html>
